<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="تأكيد الحضور — medad Al tahaya" />
    <meta name="referrer" content="no-referrer" />
    <title>تأكيد الحضور | medad Al tahaya</title>
    <link rel="icon" href="images/Medad-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/flow.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/studio.css" />
  </head>
  <body class="app-body">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <header class="app-header">
      <div class="container header-inner">
        <a class="brand" href="index.html"
          ><img src="images/Medad-logo.png" alt="شعار medad Al tahaya" width="48" height="48" /><span
            ><strong>medad Al tahaya</strong><small>تأكيد الحضور</small></span
          ></a
        >
        <div class="header-actions"><a class="text-link" href="index.html">الرئيسية</a></div>
      </div>
    </header>
    <main class="app-main" id="main">
      <div class="container">
        <p class="form-alert" id="page-error" role="alert" hidden></p>
        <article class="center-card">
          <section id="rsvpFormState" hidden>
            <h1>نسعد بمعرفة ردّك</h1>
            <p>مرحبًا <strong id="rsvp-guest"></strong></p>
            <h2 id="rsvp-event"></h2>
            <p id="rsvp-date"></p>
            <p id="rsvp-venue"></p>
            <p id="rsvp-child-policy"></p>
            <form id="rsvpForm">
              <fieldset class="field">
                <legend>هل ستشرفنا بالحضور؟</legend>
                <label
                  ><input type="radio" name="attendance" value="yes" required /> نعم، بكل
                  سرور</label
                ><label
                  ><input type="radio" name="attendance" value="no" required /> أعتذر عن
                  الحضور</label
                >
              </fieldset>
              <div id="attendanceDetails" hidden>
                <label class="field"
                  ><span>الاسم على بطاقة الدخول</span
                  ><input id="guestName" name="guestName" maxlength="100" /></label
                ><label class="field"
                  ><span>المرافقون المسموحون</span
                  ><select id="companions" name="companions"></select
                ></label>
              </div>
              <label class="field"
                ><span>رسالة لصاحب المناسبة</span
                ><textarea id="guest-message" name="message" maxlength="300"></textarea>
              </label>
              <p class="form-alert" id="rsvpError" role="alert" hidden></p>
              <button class="button button-primary button-block" type="submit">
                إرسال الرد النهائي
              </button>
              <p>يُحفظ الرد مرة واحدة. لتغييره تواصل مع صاحب المناسبة.</p>
            </form>
          </section>
          <section id="rsvpSuccessState" hidden>
            <h1 id="successTitle"></h1>
            <div id="ticketCard" class="ticket-card" hidden>
              <h2 id="ticketGuestName"></h2>
              <p id="ticket-companions"></p>
              <img id="ticket-qr" width="256" height="256" alt="رمز بطاقة الدخول" />
              <p id="ticket-status"></p>
              <details>
                <summary>إظهار رمز الإدخال اليدوي</summary>
                <code id="ticket-token" dir="ltr" class="token-value"></code>
              </details>
              <p>
                يمكنك العودة إلى رابط الدعوة لعرض بطاقتك. لا تشارك الرابط أو البطاقة مع الآخرين.
              </p>
            </div>
          </section>
          <a
            class="button button-secondary button-block"
            id="invitation-link"
            href="invitation.html"
            >تفاصيل الدعوة</a
          >
        </article>
      </div>
    </main>
    <noscript><p>يلزم تفعيل JavaScript لاستخدام هذه الصفحة.</p></noscript>
    <script type="module" src="js/rsvp.js"></script>
  </body>
</html>
