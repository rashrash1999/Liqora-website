<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="بوابة الاستقبال — medad Al tahaya" />
    <meta name="referrer" content="no-referrer" />
    <title>بوابة الاستقبال | medad Al tahaya</title>
    <link rel="icon" href="images/Medad-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/flow.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/studio.css" />
  </head>
  <body class="app-body" data-auth="staff">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <header class="app-header">
      <div class="container header-inner">
        <a class="brand" href="index.html"
          ><img src="images/Medad-logo.png" alt="شعار medad Al tahaya" width="48" height="48" /><span
            ><strong>medad Al tahaya</strong><small>بوابة الاستقبال</small></span
          ></a
        >
        <div class="header-actions">
          <a class="text-link" href="index.html">الرئيسية</a
          ><button class="button button-secondary button-sm" data-logout type="button">
            تسجيل الخروج
          </button>
        </div>
      </div>
    </header>
    <main class="app-main" id="main">
      <div class="container">
        <p class="form-alert" id="page-error" role="alert" hidden></p>
        <div id="protected-content" class="checkin-layout">
          <section class="app-card checkin-scanner">
            <h1>التحقق من بطاقة الدخول</h1>
            <label class="field"
              ><span>المناسبة المعيّنة لك</span
              ><select id="gate-order"></select
            ></label>
            <video id="camera" playsinline muted hidden class="camera-preview"></video
            ><button id="start-camera" class="button button-secondary" type="button">
              تشغيل الكاميرا</button
            ><button id="stop-camera" class="button button-secondary" type="button" hidden>
              إيقاف الكاميرا
            </button>
            <p>يمكن استخدام قارئ QR أو إدخال الرمز اليدوي الموجود في البطاقة.</p>
            <label class="field"
              ><span>رمز البطاقة</span><input id="tokenInput" autocomplete="off" dir="ltr" /></label
            ><button id="verifyButton" class="button button-primary button-block" type="button">
              التحقق من البطاقة
            </button>
          </section>
          <section class="app-card checkin-result">
            <div id="guestResult" hidden>
              <span class="pill" id="guestStatus"></span>
              <h2 id="gate-guest"></h2>
              <p>المرافقون: <strong id="gate-companions"></strong></p>
              <button
                class="button button-primary button-block"
                id="checkinButton"
                type="button"
                disabled
              >
                تسجيل الدخول الآن
              </button>
            </div>
            <p>يتم التحقق من صلاحية البطاقة وحالة استخدامها عند كل عملية. يلزم اتصال بالإنترنت.</p>
          </section>
        </div>
      </div>
    </main>
    <noscript><p>يلزم تفعيل JavaScript لاستخدام هذه الصفحة.</p></noscript>
    <script type="module" src="js/checkin.js"></script>
  </body>
</html>
