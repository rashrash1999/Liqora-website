<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="دعوتك الشخصية — medad Al tahaya" />
    <meta name="referrer" content="no-referrer" />
    <title>دعوتك الشخصية | medad Al tahaya</title>
    <link rel="icon" href="images/Medad-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/flow.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/invitation.css" />
  </head>
  <body class="app-body">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <header class="app-header">
      <div class="container header-inner">
        <a class="brand" href="index.html"
          ><img src="images/Medad-logo.png" alt="شعار medad Al tahaya" width="48" height="48" /><span
            ><strong>medad Al tahaya</strong><small>دعوتك الشخصية</small></span
          ></a
        >
        <div class="header-actions"><a class="text-link" href="index.html">الرئيسية</a></div>
      </div>
    </header>
    <main class="app-main" id="main">
      <div class="container">
        <p class="form-alert" id="page-error" role="alert" hidden></p>
        <div id="invitationPage" hidden>
          <section class="invitation-hero">
            <div class="hero-inner">
              <p>بسم الله الرحمن الرحيم</p>
              <h1 data-honorees></h1>
              <p class="hero-message" id="invitation-message"></p>
            </div>
          </section>
          <section class="details-section">
            <h2>تفاصيل المناسبة</h2>
            <div class="details-grid">
              <article>
                <h3>التاريخ</h3>
                <p id="invitation-date"></p>
              </article>
              <article>
                <h3>الوقت</h3>
                <p id="invitation-time"></p>
              </article>
              <article>
                <h3>المكان</h3>
                <p id="invitation-venue"></p>
              </article>
            </div>
            <a
              class="invitation-button outline"
              id="invitation-map"
              href="https://maps.google.com"
              target="_blank"
              rel="noopener noreferrer"
              >فتح الخريطة</a
            >
          </section>
          <section class="countdown-section">
            <h2>المتبقي على المناسبة</h2>
            <div class="countdown">
              <div><strong id="days">—</strong><small>يوم</small></div>
              <div><strong id="hours">—</strong><small>ساعة</small></div>
              <div><strong id="minutes">—</strong><small>دقيقة</small></div>
              <div><strong id="seconds">—</strong><small>ثانية</small></div>
            </div>
          </section>
          <section class="rsvp-section">
            <div class="rsvp-card">
              <h2>نسعد بحضورك</h2>
              <p id="invitation-child-policy"></p>
              <a class="invitation-button gold" id="rsvp-link" href="rsvp.html"
                >تأكيد الحضور أو عرض بطاقتك</a
              >
            </div>
          </section>
        </div>
      </div>
    </main>
    <noscript><p>يلزم تفعيل JavaScript لاستخدام هذه الصفحة.</p></noscript>
    <script type="module" src="js/invitation.js"></script>
  </body>
</html>
