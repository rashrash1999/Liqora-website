<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="تفاصيل مناسبة medad Al tahaya." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#183c36" />
    <title>تفاصيل المناسبة | medad Al tahaya</title>
    <link rel="icon" href="images/Medad-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/invitation.css" />
    <link rel="stylesheet" href="css/guest-registration.css" />
  </head>
  <body class="guest-page">
    <a class="skip-link" href="#main">انتقل إلى تفاصيل المناسبة</a>
    <header class="guest-header">
      <a class="brand" href="index.html"
        ><img src="images/Medad-logo.png" alt="شعار medad Al tahaya" width="44" height="44" /><span
          ><strong>medad Al tahaya</strong><small>دعوة إلكترونية آمنة</small></span
        ></a
      >
    </header>
    <main id="main" class="guest-layout">
      <p class="form-alert" id="page-error" role="alert" hidden></p>
      <section class="guest-invitation theme-classic" id="public-card" hidden>
        <img
          class="custom-design-art"
          id="public-design"
          alt="التصميم الخاص المعتمد للمناسبة"
          hidden
        />
        <span class="guest-kicker" id="public-occasion">دعوة مناسبة</span>
        <h1 id="public-honorees"></h1>
        <p id="public-message"></p>
        <dl class="guest-event-details">
          <div>
            <dt>التاريخ</dt>
            <dd id="public-date"></dd>
          </div>
          <div>
            <dt>الوقت</dt>
            <dd id="public-time"></dd>
          </div>
          <div>
            <dt>المكان</dt>
            <dd id="public-venue"></dd>
          </div>
        </dl>
        <a
          id="public-map"
          class="invitation-button outline"
          target="_blank"
          rel="noopener noreferrer"
          >فتح الخريطة</a
        >
        <p class="guest-policy" id="public-policy"></p>
        <small>بدعوة من medad Al tahaya</small>
      </section>

      <section class="guest-form-card guest-result" id="registration-unavailable" hidden>
        <span class="result-mark" aria-hidden="true">i</span>
        <span class="pill pill-warning">تحديث أمني مؤقت</span>
        <h2 id="registration-unavailable-title">التسجيل العام متوقف مؤقتًا</h2>
        <p id="registration-unavailable-message"></p>
        <p>
          إذا وصلك رابط شخصي من صاحب المناسبة، افتحه مباشرة لتأكيد حضورك أو اعتذارك دون تسجيل عام.
        </p>
      </section>
    </main>
    <noscript><p>يلزم تفعيل JavaScript لعرض تفاصيل المناسبة.</p></noscript>
    <script type="module" src="js/join.js"></script>
  </body>
</html>
